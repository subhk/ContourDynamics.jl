name: CI
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    # All four CPU test groups run in one job per (version, OS). The whole
    # suite takes a few minutes, so splitting by group only multiplied jobs.
    # Every supported Julia version runs on Ubuntu; macOS runs on the latest
    # version only, since the code has no OS-specific paths.
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1.11', '1.12']
        os: [ubuntu-latest]
        include:
          - version: '1.12'
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run CPU test groups
        env:
          JULIA_NUM_THREADS: 2
        run: julia --project=. -e 'using Pkg; Pkg.test(; test_args=["core", "numerical", "device", "performance"])'

  extensions:
    # The three optional extensions are tested together through the
    # `extensions` group, on the oldest and newest supported Julia versions.
    name: Julia ${{ matrix.version }} - extensions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1.12']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - name: Test optional extensions
        run: >-
          julia --color=yes -e '
            using Pkg;
            Pkg.activate(; temp=true);
            Pkg.develop(path=pwd());
            Pkg.add(["JLD2", "OrdinaryDiffEq", "RecordedArrays", "StaticArrays"]);
            push!(ARGS, "extensions");
            include(joinpath(pwd(), "test", "runtests.jl"));'
