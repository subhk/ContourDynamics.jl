name: Draft JOSS paper
on:
  push:
    paths: ['paper/**']
  workflow_dispatch:
jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build draft PDF
        # Pinned to an immutable commit (master of 2026-07-26) rather than a
        # moving ref, so a change upstream cannot alter this workflow silently.
        uses: openjournals/openjournals-draft-action@85a18372e48f551d8af9ddb7a747de685fbbb01c
        with:
          journal: joss
          paper-path: paper/paper.md
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/paper.pdf
