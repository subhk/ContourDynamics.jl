name: TagBot

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    # The repository default token is read-only. Grant write access only to
    # this pinned release job instead of broadening every workflow.
    permissions:
      contents: write
      issues: write
      pull-requests: read
    steps:
      - uses: JuliaRegistries/TagBot@6b7c22e7bc2b8f4d1c56b7199a63421cf2667ed1 # v1.25.7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Optional but recommended: lets TagBot-created tags trigger the
          # tag-based CI and documentation workflows.
          ssh: ${{ secrets.DOCUMENTER_KEY }}
